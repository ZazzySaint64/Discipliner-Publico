name: Limpar artefatos antigos

# Libera o armazenamento do Actions apagando artefatos antigos.
#
# Por que existe: no plano Free são 500 MB de armazenamento por conta, e ele
# NÃO zera todo mês (só os minutos de execução resetam). Cada APK tinha ~60 MB,
# então a cota enchia rápido. O build do APK saiu do Actions (agora é local, no
# WSL — ver scripts/build-local.sh), então artefato novo não é mais criado —
# este workflow serve só pra limpar o BACKLOG antigo de builds que já rodaram.
#
# Não precisa do gh instalado na sua máquina nem de token pessoal: roda no
# runner, com o GITHUB_TOKEN embutido (por isso o "permissions: actions: write").
#
# SEMPRE começa em simulação: a primeira execução só LISTA o que apagaria.
# Confira a lista e rode de novo com "simular" desmarcado pra apagar de verdade.
on:
  workflow_dispatch:
    inputs:
      manter:
        description: "Quantos artefatos MAIS RECENTES preservar (o último deploy fica)"
        required: true
        default: "1"
      simular:
        description: "Só listar, sem apagar nada"
        type: boolean
        required: true
        default: true

permissions:
  actions: write   # necessário pra apagar artefato
  contents: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apagar artefatos, preservando os mais recentes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MANTER: ${{ inputs.manter }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          set -euo pipefail

          # --paginate: repositório com muitos builds passa de uma página, e
          # sem isso a limpeza só pegaria os 30 primeiros e pareceria não ter
          # funcionado. Ordena do mais NOVO pro mais velho.
          gh api --paginate "repos/$REPO/actions/artifacts" \
            --jq '.artifacts[] | [.id, .created_at, .name, .size_in_bytes] | @tsv' \
            | sort -k2 -r > todos.tsv || true

          total=$(wc -l < todos.tsv)
          if [ "$total" -eq 0 ]; then
            echo "Nenhum artefato encontrado — nada a fazer."
            exit 0
          fi

          bytes_total=$(awk -F'\t' '{s+=$4} END{print s+0}' todos.tsv)
          echo "Artefatos hoje: $total  ($(( bytes_total / 1024 / 1024 )) MB)"
          echo
          echo "=== PRESERVADOS (os $MANTER mais recentes) ==="
          head -n "$MANTER" todos.tsv | awk -F'\t' '{printf "  %s  %s  %d MB\n", $2, $3, $4/1024/1024}'

          tail -n +$(( MANTER + 1 )) todos.tsv > apagar.tsv || true
          n=$(wc -l < apagar.tsv)
          if [ "$n" -eq 0 ]; then
            echo
            echo "Nada além disso pra apagar."
            exit 0
          fi

          bytes_apagar=$(awk -F'\t' '{s+=$4} END{print s+0}' apagar.tsv)
          echo
          echo "=== A APAGAR: $n artefato(s), $(( bytes_apagar / 1024 / 1024 )) MB ==="
          awk -F'\t' '{printf "  %s  %s  %d MB\n", $2, $3, $4/1024/1024}' apagar.tsv

          if [ "$SIMULAR" = "true" ]; then
            echo
            echo "::notice::SIMULAÇÃO — nada foi apagado. Rode de novo com 'simular' desmarcado."
            exit 0
          fi

          echo
          falhas=0
          while IFS=$'\t' read -r id criado nome tamanho; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" --silent; then
              echo "apagado: $nome ($criado)"
            else
              echo "::warning::não consegui apagar o artefato $id ($nome)"
              falhas=$((falhas + 1))
            fi
          done < apagar.tsv

          echo
          echo "::notice::Liberados ~$(( bytes_apagar / 1024 / 1024 )) MB. O uso mostrado pelo GitHub recalcula a cada 6-12h."
          [ "$falhas" -eq 0 ]
