<!doctype html>
<html lang="pt-BR">
<meta charset="UTF-8">
<title>E-mail Confirmado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #e9f1e6;
    --accent: #2e8b4f;
    --accent-dim: #256e40;
    --accent-soft: #dcefe1;
    --text: #16241a;
    --muted: #5c6b5e;
    --border: #d7e3d2;
    --shadow: 0 24px 60px -24px rgba(20, 20, 20, 0.16);
  }

  /* página sempre clara, de propósito — é uma tela de transição rápida
     (o usuário volta pro app em seguida), não precisa seguir o tema
     escuro do sistema */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 44px 36px 36px;
    box-shadow: var(--shadow);
    text-align: center;
  }

  .icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    margin: 0 auto 28px;
    display: block;
  }

  .badge {
    width: 84px;
    height: 84px;
    margin: 0 auto 26px;
  }

  .badge circle {
    fill: none;
    stroke: var(--accent-soft);
    stroke-width: 5;
  }

  .badge .ring {
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-dasharray: 208;
    stroke-dashoffset: 208;
    animation: draw-ring 0.6s cubic-bezier(.4,0,.2,1) 0.1s forwards;
  }

  .badge .check {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw-check 0.35s ease-out 0.65s forwards;
  }

  @keyframes draw-ring { to { stroke-dashoffset: 0; } }
  @keyframes draw-check { to { stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .badge .ring, .badge .check {
      animation: none;
      stroke-dashoffset: 0;
    }
  }

  .eyebrow {
    font-family: "Sora", "Work Sans", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Sora", "Work Sans", sans-serif;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
    text-wrap: balance;
  }

  p {
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 8px;
  }

  .instruction {
    margin-top: 26px;
    padding: 18px 20px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: left;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .instruction svg {
    flex: none;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .instruction p {
    color: var(--text);
    margin: 0;
    font-size: 14.5px;
  }

  .instruction strong {
    color: var(--accent-dim);
    font-weight: 600;
  }

  footer {
    margin-top: 30px;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
</style>
